<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https: http:; connect-src 'none'">
  <title>GitLab Desk</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar">
    <button class="tb-item" id="tb-repo" aria-haspopup="dialog">
      <span class="tb-label">Repository</span>
      <span class="tb-value" id="tb-repo-name">Nessun repository</span>
    </button>
    <button class="tb-item" id="tb-branch" aria-haspopup="dialog" disabled>
      <span class="tb-label">Branch</span>
      <span class="tb-value" id="tb-branch-name">—</span>
    </button>
    <div class="route" id="route" hidden>
      <span class="route-line"></span>
      <span class="route-counts" id="route-counts"></span>
      <span class="route-line"></span>
      <span class="route-end" id="route-end">origin</span>
    </div>
    <div class="tb-spacer"></div>
    <button class="tb-action" id="tb-sync" disabled>Fetch</button>
    <button class="tb-action primary" id="tb-mr" disabled hidden>Crea merge request</button>
    <button class="tb-icon" id="tb-settings" title="Impostazioni" aria-label="Impostazioni">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M11.3 1.5l.4 2.3c.5.2 1 .5 1.5.9l2.2-.8 1.3 2.2-1.8 1.5c.1.5.1 1.1 0 1.7l1.8 1.5-1.3 2.2-2.2-.8c-.5.4-1 .7-1.5.9l-.4 2.3H8.7l-.4-2.3c-.5-.2-1-.5-1.5-.9l-2.2.8-1.3-2.2 1.8-1.5a5 5 0 010-1.7L3.3 6.1l1.3-2.2 2.2.8c.5-.4 1-.7 1.5-.9l.4-2.3h2.6zM10 7a3 3 0 100 6 3 3 0 000-6z"/></svg>
    </button>
  </header>

  <div class="layout">
    <aside class="side">
      <nav class="tabs" role="tablist">
        <button role="tab" class="tab" data-tab="changes" aria-selected="true">Modifiche <span class="count" id="count-changes"></span></button>
        <button role="tab" class="tab" data-tab="history" aria-selected="false">Cronologia</button>
        <button role="tab" class="tab" data-tab="mrs" aria-selected="false">Merge request <span class="count" id="count-mrs"></span></button>
      </nav>
      <div class="side-body" id="side-body"></div>
      <div class="side-foot" id="side-foot"></div>
    </aside>
    <main class="main" id="main"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <script src="ui.js"></script>
  <script src="diff.js"></script>
  <script src="app.js"></script>
</body>
</html>
